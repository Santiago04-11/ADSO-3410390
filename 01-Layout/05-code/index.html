<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latin Mafia</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/master.css">
</head>
<body>
    <main>
        <header>
            <!-- Asumo que tu logo.svg ya tiene el texto "LATIN MAFIA" o lo pondremos con CSS -->
            <img class="logo" src="images/logo.svg" alt="Logo">
            <nav class="options">
                <a href="#inicio">Inicio</a>
                <a href="#musica">Música</a>
                <a href="#tour">Tour</a>
                <a href="#media">Media</a>
                <a href="#contacto">Contacto</a>
            </nav>
        </header>

        <!-- SECCIÓN INICIO / HERO -->
        <section id="inicio" class="hero">
            <div class="hero-content">
                <h1 class="hero-title">
                    LATIN<br>MAFIA
                </h1>
                <p class="hero-subtitle">MÚSICA. FAMILIA. MAFIA.</p>
                
                <div class="hero-badge">
                    <span>LATIN<br>MAFIA</span>
                </div>

                <p class="hero-description">
                    Latin Mafia es un trío mexicano que crea música alternativa con sonidos que cruzan fronteras.
                </p>

                <div class="hero-buttons">
                    <a href="#" class="btn btn-primary">ESCUCHAR AHORA</a>
                    <a href="#" class="btn btn-secondary">ÚLTIMO LANZAMIENTO</a>
                </div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
