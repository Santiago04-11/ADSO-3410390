<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01-Wireframe LO-FI</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        body.mainmenu.javascript {
            
            overflow-y: hidden;

            main {
                max-width: 420px;
                header {
                    h1 {
                        font-size: 2.6rem;
                    }
                }
            }
            div.info,
            div.controls,
            div.trainer{
                position: absolute;
            }
            div.info{
                background-color: rgba(150, 136, 136, 0.438);
                color: #fff;
                padding: 0.8rem;
                left: 50%;
                transform: translate(-50%);
                text-align: center;
                font-size: 0.8rem;
                border-radius: 14px;
                corner-shape: squircle;
                width: 340px;
            }
            div.controls{
                left: 50%;
                transform: translateX(-50%);
                gap: 0.4rem;
                top: rem;
            }
            button{
                border: none;
                border-radius: 14px;
                corner-shape: squircle;
                font-size: 1.5rem;
                height: 50px;
                width: 50px;
               color: #fff;
                background-color: rgba(240, 255, 255, 0.459);

                &:last-child{
                    margin-top: 0.3rem;
                }
                
            }
            div.trainer{
                background: url(imgs/steps-all.png);
                height: 256px;
                left: 50%;
                transform: translate(-50%);
                zoom: 0.8;
                bottom: 4rem;
                width: 256px;

                animation: 0,6s animTrainer steps(4) infinite;

                &.down { background-position-y: calc(256px * 0);}
                &.left { background-position-y: calc(256px * -1);}
                &.right { background-position-y: calc(256px * -2);}
                &.up { background-position-y: calc(256px * -3);}
                
               
               
                
            }
        }
        @keyframes animTrainer {
            100% {background-position-x: -1024px;}
        }
    </style>
</head>
<body class="mainmenu">
    <nav class="back">
        <a href="menujs.html" aria-label="Volver al menú de Layout">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header>
           <div class="house">
                <div class="info">
                    press arrows keys: <br>
                    &larr;
                    &uarr;
                    &rarr;
                    &darr;
                </div>
        
                <div class="controls">
                    
                    <button class="btn-left">&larr;</button>
                    <button class="btn-up">&uarr;</button>
                    <button class="btn-right">&rarr;</button>
                    <button class="btn-down">&darr;</button>
                </div>
            
                <img src="imgs/bg-steps.png">
        </div>
        </header>
        
    </main>
    <script>
        const trainer = document.getElementById('trainer');
        const btnLeft = document.querySelector ('.btn-left');
        const btnUp = document.querySelector ('.btn-up');
        const btnRight = document.querySelector ('.btn-right');
        const btnDown = document.querySelector ('.btn-down');


        btnLeft.addEventListener('click', function() {
            trainer.className ='left';
        });
        btnUp.addEventListener('click', function() {
            trainer.className ='up';
        });
        btnRight.addEventListener('click', function() {
            trainer.className ='right';
        });
        btnDown.addEventListener('click', function() {
            trainer.className ='down';
        });

        document.addEventListener('keyup', function(event) {
            //console.log(event.key)
            //console.log(event.keyCode)

            switch (event.keyCode) {
                case 37:
                    trainer.className = 'left'
                    break;
                case 38:
                    trainer.className = 'up'
                    break;
                case 39:
                    trainer.className = 'right'
                    break;
                case 40:
                    trainer.className = 'down'
                    break;
            
            }

        });
    </script>
</body>
</html>
